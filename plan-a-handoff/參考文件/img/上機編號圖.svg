<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 680" width="760" height="680" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif">
  <!-- 俯視圖：中心 (380,350)，1 mm = 2 px；世界 (x,y) mm → (380+2x, 350-2y) -->
  <rect width="760" height="680" fill="#ffffff"/>
  <text x="380" y="30" font-size="18" text-anchor="middle" fill="#3b3024" font-weight="bold">從上面往下看：伺服編號、正面、GY-521 位置</text>

  <!-- 正面 -->
  <polygon points="380,48 368,70 392,70" fill="#b5651d"/>
  <text x="380" y="92" font-size="17" text-anchor="middle" fill="#b5651d" font-weight="bold">正面（前，+y）</text>

  <!-- 平台 Ø198 -->
  <circle cx="380" cy="350" r="198" fill="#f6efe2" stroke="#6b5a45" stroke-width="2"/>
  <!-- 壓電片 Ø35（平台底面中心） -->
  <circle cx="380" cy="350" r="35" fill="none" stroke="#a89880" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="380" y="355" font-size="12" text-anchor="middle" fill="#8a7a62">壓電片</text>

  <!-- 三隻腳：伺服軸在半徑 35、臂朝外到半徑 80（球頭在正上方） -->
  <g stroke="#b07a3a" stroke-width="10" stroke-linecap="round">
    <line x1="380" y1="280" x2="380" y2="190"/>
    <line x1="319.4" y1="385" x2="241.4" y2="430"/>
    <line x1="440.6" y1="385" x2="518.6" y2="430"/>
  </g>
  <g fill="#4a4a4a">
    <rect x="371" y="271" width="18" height="18" rx="3"/>
    <rect x="310.4" y="376" width="18" height="18" rx="3"/>
    <rect x="431.6" y="376" width="18" height="18" rx="3"/>
  </g>
  <g fill="#ffffff" stroke="#3b3024" stroke-width="2">
    <circle cx="380" cy="190" r="7"/>
    <circle cx="241.4" cy="430" r="7"/>
    <circle cx="518.6" cy="430" r="7"/>
  </g>

  <!-- 編號圓章（半徑 112 mm 處） -->
  <g font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <circle cx="380" cy="126" r="15" fill="#b5651d"/><text x="380" y="132">1</text>
    <circle cx="186" cy="462" r="15" fill="#b5651d"/><text x="186" y="468">2</text>
    <circle cx="574" cy="462" r="15" fill="#b5651d"/><text x="574" y="468">3</text>
  </g>
  <g font-size="15" fill="#3b3024">
    <text x="402" y="131">1 號伺服 → PCA9685 第 0 路（90°）</text>
    <text x="150" y="502" text-anchor="middle">2 號 → 第 1 路（210°）</text>
    <text x="610" y="502" text-anchor="middle">3 號 → 第 2 路（330°）</text>
  </g>

  <!-- GY-521 座：照 BOM 雕刻（亮面朝上、沒鏡像），翻過來用時在左前 150°；座子 28×20、封閉端朝箭頭 -->
  <rect x="282.7" y="292" width="56" height="40" fill="#cfe5c3" stroke="#4f8a3a" stroke-width="2"/>
  <line x1="310.7" y1="326" x2="310.7" y2="302" stroke="#2f6a20" stroke-width="2.5"/>
  <polygon points="310.7,294 304.7,305 316.7,305" fill="#2f6a20"/>
  <line x1="282.7" y1="296" x2="170" y2="236" stroke="#4f8a3a" stroke-width="1.5"/>
  <text x="20" y="190" font-size="14" fill="#2f6a20">GY-521 座（黏在平台底面）</text>
  <text x="20" y="210" font-size="14" fill="#2f6a20">箭頭朝正面</text>
  <text x="20" y="230" font-size="14" fill="#2f6a20">照 BOM 雕刻的會在這裡</text>

  <!-- 雕的時候有鏡像：右前 30° -->
  <rect x="421.3" y="292" width="56" height="40" fill="none" stroke="#8fb47e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="449.3" y1="326" x2="449.3" y2="302" stroke="#8fb47e" stroke-width="2"/>
  <polygon points="449.3,294 443.3,305 455.3,305" fill="#8fb47e"/>
  <line x1="477.3" y1="305" x2="584" y2="262" stroke="#8fb47e" stroke-width="1.5"/>
  <text x="586" y="250" font-size="13" fill="#6f9a5c">雕刻時有鏡像的話</text>
  <text x="586" y="268" font-size="13" fill="#6f9a5c">會在右前（30°）</text>

  <!-- 左右、背面 -->
  <text x="165" y="356" font-size="16" text-anchor="end" fill="#3b3024">左（−x）</text>
  <text x="595" y="356" font-size="16" fill="#3b3024">右（+x）</text>
  <text x="380" y="590" font-size="17" text-anchor="middle" fill="#3b3024" font-weight="bold">背面（後）</text>
  <text x="380" y="616" font-size="14" text-anchor="middle" fill="#5c4f3f">站在背面往前看：左手邊是 2 號、右手邊是 3 號</text>

  <!-- 座標 -->
  <g stroke="#3b3024" stroke-width="2" fill="#3b3024">
    <line x1="50" y1="650" x2="104" y2="650"/><polygon points="112,650 102,645 102,655"/>
    <line x1="50" y1="650" x2="50" y2="596"/><polygon points="50,588 45,598 55,598"/>
  </g>
  <text x="118" y="655" font-size="14" fill="#3b3024">+x 右</text>
  <text x="58" y="590" font-size="14" fill="#3b3024">+y 前</text>
  <text x="740" y="655" font-size="13" text-anchor="end" fill="#5c4f3f">伺服軸在半徑 35 mm、臂朝外到 80 mm；伺服角：臂往上＝正</text>
</svg>
